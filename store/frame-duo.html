<!doctype html>
<!-- iPhone Duo store screenshot frame (dev only): /store/frame-duo.html?display=outer|inner&demo=home&t=Title&s=Subtitle
     outer: 1398×2034 canvas, 466×678pt screen. inner: 2853×2007 canvas, 951×669pt screen. Both have the 84pt status rail. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/bricolage-grotesque/index.css">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#14051f;font-family:'Bricolage Grotesque Variable',system-ui;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(70% 45% at 15% 8%,#ff3d8b66,transparent),radial-gradient(70% 45% at 95% 40%,#5b2cff77,transparent),radial-gradient(60% 40% at 30% 100%,#b026ff55,transparent),#14051f}
.cap{position:absolute;left:0;right:0;text-align:center;padding:0 6vw}
.t{font-weight:800;letter-spacing:-.03em;line-height:1.02}
.t em{font-style:normal;color:#d7ff3a}
.s{margin-top:.6em;color:rgba(255,246,251,.72);font-weight:600}
.device{position:absolute;left:50%;transform:translateX(-50%);background:#0b0b0f;box-shadow:0 0 0 3px #2a2a33,0 60px 120px rgba(0,0,0,.6)}
.screen{position:absolute;overflow:hidden;background:#14051f}
iframe{border:0;position:absolute;left:0;top:0;transform-origin:0 0;background:#14051f}
/* Status rail on the trailing edge (time + status icons stacked), like the iPhone Duo. */
.rail{position:absolute;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,system-ui;font-weight:700;color:#fff;background:#0d0216}
.fold{position:absolute;top:0;bottom:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.035) 45%,rgba(0,0,0,.18) 50%,rgba(255,255,255,.035) 55%,transparent)}
</style></head><body>
<div class="bg"></div>
<div class="cap"><div class="t" id="t"></div><div class="s" id="s"></div></div>
<div class="device" id="device"><div class="screen" id="screen">
  <iframe id="app"></iframe>
  <div class="fold" id="fold" hidden></div>
  <div class="rail" id="rail"><span id="time">9:41</span><svg id="icons" viewBox="0 0 20 34" fill="#fff"><path d="M3 6.5a10 10 0 0 1 14 0l-1.7 1.8a7.6 7.6 0 0 0-10.6 0zM5.8 9.5a6 6 0 0 1 8.4 0l-1.8 1.8a3.6 3.6 0 0 0-4.8 0zM10 15l2.2-2.3a3.1 3.1 0 0 0-4.4 0z"/><rect x="5" y="21" width="10" height="12" rx="2.5" fill="none" stroke="#fff" stroke-width="1.2" opacity=".5"/><rect x="6.5" y="22.5" width="7" height="9" rx="1.5"/></svg></div>
</div></div>
<script>
const q = new URLSearchParams(location.search)
const INNER = q.get('display') === 'inner'
const W = innerWidth, H = innerHeight
document.getElementById('t').innerHTML = q.get('t') || ''
document.getElementById('s').textContent = q.get('s') || ''
const cap = document.querySelector('.cap'), t = document.getElementById('t'), s = document.getElementById('s')
// Caption size from the shorter side so both canvases read the same.
const base = Math.min(W, H)
t.style.fontSize = base * (INNER ? 0.075 : 0.083) + 'px'
s.style.fontSize = base * (INNER ? 0.032 : 0.038) + 'px'
cap.style.top = H * 0.045 + 'px'

// Screen in points, plus the insets the app sees (measured on the iOS 27.1 simulator).
const DW = INNER ? 951 : 466, DH = INNER ? 669 : 678, RAIL = 84
const INSETS = INNER ? { top: 0, right: RAIL, bottom: 20 } : { top: 82, right: RAIL, bottom: 34 }
const capBottom = cap.offsetTop + cap.offsetHeight
const deviceTop = Math.max(H * (INNER ? 0.2 : 0.18), capBottom + H * 0.025)
const scale = Math.min((W * 0.86) / DW, (H - deviceTop - H * 0.04) / DH)
const bezel = 13 * scale
const device = document.getElementById('device')
Object.assign(device.style, { width: DW * scale + bezel * 2 + 'px', height: DH * scale + bezel * 2 + 'px', top: deviceTop + "px", borderRadius: 48 * scale + 'px' })
Object.assign(document.getElementById('screen').style, { left: bezel + 'px', top: bezel + 'px', width: DW * scale + 'px', height: DH * scale + 'px', borderRadius: 38 * scale + 'px' })
Object.assign(document.getElementById('rail').style, { width: RAIL * scale + 'px', paddingTop: 22 * scale + 'px', gap: 10 * scale + 'px', fontSize: 16 * scale + 'px' })
document.getElementById('icons').style.width = 20 * scale + 'px'
if (INNER) {
  // The fold sits at x 455–495pt (flat: just a faint crease).
  const fold = document.getElementById('fold')
  fold.hidden = false
  Object.assign(fold.style, { left: 455 * scale + 'px', width: 40 * scale + 'px' })
}
const f = document.getElementById('app')
Object.assign(f.style, { width: DW + 'px', height: DH + 'px', transform: `scale(${scale})` })
f.onload = () => {
  const root = f.contentDocument.documentElement.style
  root.setProperty('--cap-native-navigation-top', INSETS.top + 'px')
  root.setProperty('--cap-native-navigation-right', INSETS.right + 'px')
  root.setProperty('--cap-native-navigation-bottom', INSETS.bottom + 'px')
}
f.src = '/?demo=' + (q.get('demo') || 'home')
</script></body></html>
